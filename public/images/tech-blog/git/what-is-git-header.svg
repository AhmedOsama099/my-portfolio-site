<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="gitAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#f97316" opacity="0.16" filter="url(#glow)" />
  <circle cx="1000" cy="380" r="260" fill="#ef4444" opacity="0.14" filter="url(#glow)" />
  <circle cx="600" cy="300" r="240" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.18">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#431407" stroke="#f97316" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#f97316" />
    <text x="36" y="23" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">GIT &amp; VERSION CONTROL</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800">
      What is Git?
    </text>
    <text x="0" y="145" fill="url(#gitAccent)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      ما هو نظام جيت ولماذا نستخدمه؟
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Distributed Version Control System: Core Concepts &amp; Architecture
    </text>

    <!-- Metadata footer pill -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="360" height="42" rx="21" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#22c55e" />
      <text x="38" y="26" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Ahmed Osama · Senior Software Engineer</text>
    </g>
  </g>

  <!-- Right Side: Graphic Card Illustration -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="390" height="410" rx="24" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)" />

    <!-- Branch tree lines -->
    <path d="M 90 320 L 90 90" stroke="#f97316" stroke-width="6" stroke-linecap="round" />
    <path d="M 90 230 C 90 170, 200 200, 200 130" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 200 130 C 200 100, 130 90, 95 90" stroke="#38bdf8" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 90 280 C 90 230, 300 240, 300 160 L 300 120" stroke="#a855f7" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- Node circles -->
    <circle cx="90" cy="320" r="14" fill="#0b0f19" stroke="#f97316" stroke-width="5" />
    <circle cx="90" cy="230" r="14" fill="#0b0f19" stroke="#f97316" stroke-width="5" />
    <circle cx="90" cy="150" r="14" fill="#0b0f19" stroke="#f97316" stroke-width="5" />
    <circle cx="90" cy="90" r="16" fill="#f97316" />

    <circle cx="200" cy="170" r="13" fill="#0b0f19" stroke="#38bdf8" stroke-width="5" />
    <circle cx="200" cy="120" r="15" fill="#38bdf8" />

    <circle cx="300" cy="200" r="13" fill="#0b0f19" stroke="#a855f7" stroke-width="5" />
    <circle cx="300" cy="120" r="15" fill="#a855f7" />

    <!-- Commit Labels -->
    <rect x="120" y="80" width="100" height="26" rx="6" fill="#030712" stroke="#f97316" stroke-width="1" />
    <text x="170" y="97" fill="#fdba74" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">main</text>

    <rect x="225" y="110" width="90" height="26" rx="6" fill="#030712" stroke="#38bdf8" stroke-width="1" />
    <text x="270" y="127" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">feature</text>

    <!-- Bottom summary badge inside card -->
    <rect x="25" y="345" width="340" height="46" rx="12" fill="#030712" stroke="#1f2937" stroke-width="1" />
    <text x="195" y="373" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Distributed · Snapshot-Based · Fast</text>
  </g>
</svg>
