<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="protoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#38bdf8" opacity="0.14" filter="url(#glow)" />
  <circle cx="1000" cy="380" r="260" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="300" r="240" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.18">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#431407" stroke="#f97316" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#f97316" />
    <text x="36" y="23" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">GIT &amp; VERSION CONTROL</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800">
      Does Git Need Internet?
    </text>
    <text x="0" y="145" fill="url(#protoAccent)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      هل يحتاج جيت للإنترنت؟ والبروتوكولات
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Offline-First Architecture &amp; Git Transfer Protocols (HTTP, SSH, Local)
    </text>

    <!-- Metadata footer pill -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="360" height="42" rx="21" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#22c55e" />
      <text x="38" y="26" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Ahmed Osama · Senior Software Engineer</text>
    </g>
  </g>

  <!-- Right Side: Graphic Card (Offline vs Online) -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="390" height="410" rx="24" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)" />

    <!-- Offline Box -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="330" height="135" rx="16" fill="#030712" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="28" cy="28" r="8" fill="#22c55e" />
      <text x="46" y="33" fill="#86efac" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">100% OFFLINE</text>
      <text x="24" y="68" fill="#e5e7eb" font-family="monospace" font-size="13">git init · git add · git commit</text>
      <text x="24" y="95" fill="#e5e7eb" font-family="monospace" font-size="13">git branch · git merge · git log</text>
      <text x="24" y="118" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Complete local copy on your machine</text>
    </g>

    <!-- Transfer Arrow -->
    <g transform="translate(195, 195)">
      <path d="M 0 -10 L 0 20 M -6 12 L 0 20 L 6 12" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
      <text x="18" y="8" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PROTOCOLS</text>
    </g>

    <!-- Online Protocols Box -->
    <g transform="translate(30, 230)">
      <rect x="0" y="0" width="330" height="145" rx="16" fill="#030712" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="28" cy="28" r="8" fill="#38bdf8" />
      <text x="46" y="33" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">NETWORKING &amp; SYNC</text>
      <g transform="translate(24, 60)">
        <rect x="0" y="0" width="62" height="26" rx="6" fill="#1e293b" />
        <text x="31" y="17" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">Local</text>

        <rect x="70" y="0" width="62" height="26" rx="6" fill="#1e293b" />
        <text x="101" y="17" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">HTTP</text>

        <rect x="140" y="0" width="62" height="26" rx="6" fill="#1e293b" />
        <text x="171" y="17" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">SSH</text>

        <rect x="210" y="0" width="62" height="26" rx="6" fill="#1e293b" />
        <text x="241" y="17" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">Git</text>
      </g>
      <text x="24" y="122" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Only required for remote team collaboration</text>
    </g>
  </g>
</svg>
