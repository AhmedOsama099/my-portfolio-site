<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="a11yAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#06b6d4" opacity="0.16" filter="url(#glow)" />
  <circle cx="1000" cy="380" r="260" fill="#3b82f6" opacity="0.14" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.18">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#134e4a" stroke="#14b8a6" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#2dd4bf" />
    <text x="36" y="23" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">WEB ACCESSIBILITY</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">
      Web Accessibility (A11y)
    </text>
    <text x="0" y="145" fill="url(#a11yAccent)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      دليل إمكانية الوصول الشامل
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Core Principles, Inclusive Design, WCAG Standards &amp; Screen Readers
    </text>

    <!-- Metadata footer pill -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="360" height="42" rx="21" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#2dd4bf" />
      <text x="38" y="26" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Ahmed Osama · Senior Software Engineer</text>
    </g>
  </g>

  <!-- Right Side: Graphic Card Illustration -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="390" height="410" rx="24" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)" />

    <!-- A11y Symbol Icon -->
    <g transform="translate(195, 140)">
      <circle cx="0" cy="0" r="65" fill="#030712" stroke="#2dd4bf" stroke-width="4" />
      <!-- Human figure in circle -->
      <circle cx="0" cy="-28" r="12" fill="#2dd4bf" />
      <path d="M -35 -5 L 35 -5 M 0 -5 L 0 35 M 0 35 L -20 60 M 0 35 L 20 60" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 4 WCAG Principles -->
    <g transform="translate(30, 260)">
      <rect x="0" y="0" width="155" height="45" rx="10" fill="#030712" stroke="#374151" stroke-width="1" />
      <text x="77" y="28" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Perceivable</text>

      <rect x="175" y="0" width="155" height="45" rx="10" fill="#030712" stroke="#374151" stroke-width="1" />
      <text x="252" y="28" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Operable</text>

      <rect x="0" y="55" width="155" height="45" rx="10" fill="#030712" stroke="#374151" stroke-width="1" />
      <text x="77" y="83" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Understandable</text>

      <rect x="175" y="55" width="155" height="45" rx="10" fill="#030712" stroke="#374151" stroke-width="1" />
      <text x="252" y="83" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Robust</text>
    </g>

    <text x="195" y="388" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">WCAG 2.2 AA/AAA · Inclusive Web For All</text>
  </g>
</svg>
