<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="idxAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="220" fill="#3178c6" opacity="0.22" filter="url(#glow)" />
  <circle cx="1000" cy="380" r="260" fill="#a855f7" opacity="0.14" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.18">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 130)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#60a5fa" />
    <text x="36" y="23" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">TYPESCRIPT SYSTEMS</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800">
      Index Signatures
    </text>
    <text x="0" y="145" fill="url(#idxAccent)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      التعامل مع الكائنات الديناميكية
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      [key: string]: Type · Dynamic Keys, Record&lt;K, V&gt; &amp; Safe Dictionary Access
    </text>

    <!-- Metadata footer pill -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="360" height="42" rx="21" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#22c55e" />
      <text x="38" y="26" fill="#e5e7eb" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Ahmed Osama · Senior Software Engineer</text>
    </g>
  </g>

  <!-- Right Side: Graphic Card Illustration -->
  <g transform="translate(730, 110)">
    <rect x="0" y="0" width="390" height="410" rx="24" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" filter="url(#glow)" />

    <!-- Code Block representation -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="330" height="150" rx="14" fill="#030712" stroke="#1e293b" stroke-width="1" />
      <circle cx="18" cy="18" r="5" fill="#ef4444" />
      <circle cx="34" cy="18" r="5" fill="#f59e0b" />
      <circle cx="50" cy="18" r="5" fill="#10b981" />
      <text x="20" y="55" fill="#60a5fa" font-family="monospace" font-size="13">interface Dictionary {</text>
      <text x="36" y="85" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="700">[key: string]: string;</text>
      <text x="20" y="115" fill="#60a5fa" font-family="monospace" font-size="13">}</text>
      <text x="20" y="136" fill="#94a3b8" font-family="monospace" font-size="11">// Unknown properties typed safely</text>
    </g>

    <g transform="translate(30, 215)">
      <rect x="0" y="0" width="330" height="130" rx="14" fill="#030712" stroke="#818cf8" stroke-width="1.5" />
      <circle cx="22" cy="24" r="7" fill="#818cf8" />
      <text x="38" y="29" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">DYNAMIC KEY LOOKUP</text>
      <text x="20" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13">Supports string, number, symbol &amp;</text>
      <text x="20" y="88" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13">template literal types seamlessly.</text>
      <text x="20" y="112" fill="#22c55e" font-family="monospace" font-size="12">✓ Safe indexed access</text>
    </g>

    <text x="195" y="385" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">TypeScript Type System Pattern</text>
  </g>
</svg>
