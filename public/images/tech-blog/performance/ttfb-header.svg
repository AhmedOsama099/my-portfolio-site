<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Ambient glowing orbs -->
  <circle cx="250" cy="180" r="180" fill="#3b82f6" opacity="0.12"/>
  <circle cx="950" cy="300" r="220" fill="#06b6d4" opacity="0.10"/>

  <!-- Left Side: Title & Badge -->
  <g transform="translate(80, 110)">
    <!-- Metric Pill Badge -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#3b82f6" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
    <text x="36" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1.5">WEB PERFORMANCE</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
      TTFB
    </text>
    <text x="175" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#94a3b8">
      Time to First Byte
    </text>

    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
      The critical foundation behind FCP, LCP &amp; Core Web Vitals
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="140" height="42" rx="10" fill="url(#badgeGrad)"/>
      <text x="70" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Good: &lt; 800ms</text>

      <rect x="155" y="0" width="170" height="42" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
      <text x="240" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Needs Work: 800-1800ms</text>

      <rect x="340" y="0" width="140" height="42" rx="10" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
      <text x="410" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">Poor: &gt; 1800ms</text>
    </g>
  </g>

  <!-- Right Side Visual Illustration Card -->
  <g transform="translate(720, 80)" filter="url(#cardShadow)">
    <rect width="400" height="320" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="2"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="400" height="42" rx="18" fill="#0f172a" fill-opacity="0.9"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="42" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="6" fill="#10b981"/>
    <text x="200" y="26" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">network.timeline.ttfb</text>

    <!-- Waterfall Steps inside Card -->
    <!-- Step 1: DNS -->
    <g transform="translate(30, 65)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">1. DNS Lookup</text>
      <rect x="140" y="4" width="45" height="16" rx="4" fill="#38bdf8"/>
      <text x="320" y="16" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="end">25ms</text>
    </g>

    <!-- Step 2: TCP + TLS -->
    <g transform="translate(30, 105)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">2. TCP + TLS Handshake</text>
      <rect x="185" y="4" width="65" height="16" rx="4" fill="#6366f1"/>
      <text x="320" y="16" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="end">65ms</text>
    </g>

    <!-- Step 3: Request Travel -->
    <g transform="translate(30, 145)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">3. Request Sent</text>
      <rect x="250" y="4" width="30" height="16" rx="4" fill="#a855f7"/>
      <text x="320" y="16" font-family="monospace" font-size="11" fill="#c084fc" text-anchor="end">15ms</text>
    </g>

    <!-- Step 4: Server Processing -->
    <g transform="translate(30, 185)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">4. Server Execution</text>
      <rect x="280" y="4" width="50" height="16" rx="4" fill="#f43f5e"/>
      <text x="320" y="16" font-family="monospace" font-size="11" fill="#fb7185" text-anchor="end">85ms</text>
    </g>

    <!-- Total TTFB Arrival Bracket -->
    <line x1="30" y1="240" x2="360" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="100" y="255" width="200" height="34" rx="8" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">First Byte Received: 190ms</text>
  </g>
</svg>
