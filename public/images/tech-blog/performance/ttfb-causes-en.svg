<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="cardBg4En" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    Primary Culprits Behind High TTFB Latency
  </text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Delays stem from physical network distance, unoptimized backend computation, and cache misses
  </text>

  <!-- Col 1: Network & DNS -->
  <g transform="translate(40, 95)">
    <rect width="220" height="230" rx="12" fill="url(#cardBg4En)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="110" cy="40" r="22" fill="#0369a1"/>
    <text x="110" y="46" text-anchor="middle" font-family="system-ui" font-size="16">🌐</text>
    <text x="110" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#7dd3fc">Network &amp; DNS</text>
    <line x1="20" y1="102" x2="200" y2="102" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Slow authoritative DNS</text>
    <text x="24" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Long geographic RTT distance</text>
    <text x="24" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Repeated cold TLS handshakes</text>
    <text x="24" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Absence of Edge CDN POPs</text>
  </g>

  <!-- Col 2: Database & Backend -->
  <g transform="translate(280, 95)">
    <rect width="220" height="230" rx="12" fill="url(#cardBg4En)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="110" cy="40" r="22" fill="#78350f"/>
    <text x="110" y="46" text-anchor="middle" font-family="system-ui" font-size="16">🗄️</text>
    <text x="110" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#fde68a">Database &amp; APIs</text>
    <line x1="20" y1="102" x2="200" y2="102" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Full-table scans / missing indexes</text>
    <text x="24" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Sequential N+1 query chains</text>
    <text x="24" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Database connection contention</text>
    <text x="24" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Slow 3rd party API dependencies</text>
  </g>

  <!-- Col 3: SSR & Server Rendering -->
  <g transform="translate(520, 95)">
    <rect width="220" height="230" rx="12" fill="url(#cardBg4En)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="110" cy="40" r="22" fill="#581c87"/>
    <text x="110" y="46" text-anchor="middle" font-family="system-ui" font-size="16">⚡</text>
    <text x="110" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#d8b4fe">SSR Blocking</text>
    <line x1="20" y1="102" x2="200" y2="102" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Blocking fetch before render</text>
    <text x="24" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Unstreamed synchronous HTML</text>
    <text x="24" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Heavy CPU-bound template tasks</text>
    <text x="24" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Bloated bundle parse overhead</text>
  </g>

  <!-- Col 4: Caching Deficiencies -->
  <g transform="translate(760, 95)">
    <rect width="220" height="230" rx="12" fill="url(#cardBg4En)" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="110" cy="40" r="22" fill="#7f1d1d"/>
    <text x="110" y="46" text-anchor="middle" font-family="system-ui" font-size="16">🚫</text>
    <text x="110" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#fca5a5">Cache Misses</text>
    <line x1="20" y1="102" x2="200" y2="102" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Dynamic render on every hit</text>
    <text x="24" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Missing Cache-Control headers</text>
    <text x="24" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Stale-while-revalidate omitted</text>
    <text x="24" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Unused Edge CDN caching tiers</text>
  </g>
</svg>
