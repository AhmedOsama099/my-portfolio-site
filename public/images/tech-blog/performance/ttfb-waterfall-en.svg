<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <text x="500" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    Why TTFB is the Prerequisite Bottleneck for FCP &amp; LCP
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    No visual rendering can start until the HTML document arrives from the server
  </text>

  <!-- Scenario 1: Slow TTFB (2000ms) -->
  <g transform="translate(50, 95)">
    <rect width="900" height="135" rx="10" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#f87171">
      ⚠️ Slow TTFB Scenario (Un-cached Server / High Latency)
    </text>

    <!-- Timeline Bars -->
    <!-- TTFB Bar -->
    <rect x="25" y="48" width="450" height="28" rx="6" fill="#ef4444" fill-opacity="0.85"/>
    <text x="250" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      TTFB: 1800ms (Waiting for First Byte)
    </text>

    <!-- Download HTML -->
    <rect x="480" y="48" width="60" height="28" rx="6" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="510" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">HTML</text>

    <!-- FCP -->
    <rect x="545" y="48" width="90" height="28" rx="6" fill="#3b82f6" fill-opacity="0.8"/>
    <text x="590" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">FCP: 2.2s</text>

    <!-- LCP -->
    <rect x="640" y="48" width="130" height="28" rx="6" fill="#e11d48" fill-opacity="0.8"/>
    <text x="705" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">LCP: 3.5s (Poor ❌)</text>

    <text x="25" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      The browser spends 1.8s completely idle waiting for server processing. LCP fails Core Web Vitals target (&lt;2.5s).
    </text>
  </g>

  <!-- Scenario 2: Fast TTFB (200ms) -->
  <g transform="translate(50, 250)">
    <rect width="900" height="135" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#34d399">
      ⚡ Optimized Fast TTFB Scenario (Edge Cached / CDN / Streaming)
    </text>

    <!-- Timeline Bars -->
    <!-- TTFB Bar -->
    <rect x="25" y="48" width="120" height="28" rx="6" fill="#10b981" fill-opacity="0.9"/>
    <text x="85" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      TTFB: 200ms
    </text>

    <!-- Download HTML -->
    <rect x="150" y="48" width="60" height="28" rx="6" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="180" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">HTML</text>

    <!-- FCP -->
    <rect x="215" y="48" width="90" height="28" rx="6" fill="#3b82f6" fill-opacity="0.8"/>
    <text x="260" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">FCP: 600ms</text>

    <!-- LCP -->
    <rect x="310" y="48" width="140" height="28" rx="6" fill="#059669" fill-opacity="0.9"/>
    <text x="380" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">LCP: 1.1s (Good ✅)</text>

    <text x="25" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
      Fast TTFB unblocks the browser instantly to discover CSS, fonts, and images. LCP finishes well within the green threshold!
    </text>
  </g>
</svg>
