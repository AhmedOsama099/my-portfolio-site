<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" dir="rtl">
  <defs>
    <linearGradient id="cardBgAr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <text x="500" y="40" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
    لماذا يعتبر TTFB عنق الزجاجة والأساس لمؤشرات FCP و LCP؟
  </text>
  <text x="500" y="65" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    لا يمكن للمتصفح بدء رسم أي عنصر على الشاشة قبل وصول ملف الـ HTML من السيرفر
  </text>

  <!-- Scenario 1: Slow TTFB (2000ms) -->
  <g transform="translate(50, 95)">
    <rect width="900" height="135" rx="10" fill="url(#cardBgAr)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="875" y="30" text-anchor="end" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="800" fill="#f87171">
      ⚠️ سيناريو TTFB بطيء (سيرفر بدون كاش / استعلامات معقدة)
    </text>

    <!-- Timeline Bars (Starts from right in RTL) -->
    <!-- TTFB Bar -->
    <rect x="425" y="48" width="450" height="28" rx="6" fill="#ef4444" fill-opacity="0.85"/>
    <text x="650" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      TTFB: 1800ms (انتظار وصول أول بايت)
    </text>

    <!-- Download HTML -->
    <rect x="360" y="48" width="60" height="28" rx="6" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="390" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">HTML</text>

    <!-- FCP -->
    <rect x="265" y="48" width="90" height="28" rx="6" fill="#3b82f6" fill-opacity="0.8"/>
    <text x="310" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">FCP: 2.2s</text>

    <!-- LCP -->
    <rect x="130" y="48" width="130" height="28" rx="6" fill="#e11d48" fill-opacity="0.8"/>
    <text x="195" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">LCP: 3.5s (سيء ❌)</text>

    <text x="875" y="108" text-anchor="end" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">
      المتصفح يقضي 1.8 ثانية خاملًا تمامًا في انتظار السيرفر. والنتيجة تأخر LCP وفشل اختبار Core Web Vitals.
    </text>
  </g>

  <!-- Scenario 2: Fast TTFB (200ms) -->
  <g transform="translate(50, 250)">
    <rect width="900" height="135" rx="10" fill="url(#cardBgAr)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <text x="875" y="30" text-anchor="end" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="800" fill="#34d399">
      ⚡ سيناريو TTFB سريع ومحسّن (Edge CDN / Caching / HTML Streaming)
    </text>

    <!-- Timeline Bars -->
    <!-- TTFB Bar -->
    <rect x="755" y="48" width="120" height="28" rx="6" fill="#10b981" fill-opacity="0.9"/>
    <text x="815" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      TTFB: 200ms
    </text>

    <!-- Download HTML -->
    <rect x="690" y="48" width="60" height="28" rx="6" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="720" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">HTML</text>

    <!-- FCP -->
    <rect x="595" y="48" width="90" height="28" rx="6" fill="#3b82f6" fill-opacity="0.8"/>
    <text x="640" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">FCP: 600ms</text>

    <!-- LCP -->
    <rect x="450" y="48" width="140" height="28" rx="6" fill="#059669" fill-opacity="0.9"/>
    <text x="520" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">LCP: 1.1s (ممتاز ✅)</text>

    <text x="875" y="108" text-anchor="end" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">
      السرعة العالية في الـ TTFB تحرر المتصفح مبكرًا لاكتشاف ملفات CSS والصور، مما يجعل LCP ينتهي في المنطقة الخضراء!
    </text>
  </g>
</svg>
