<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" dir="rtl">
  <defs>
    <linearGradient id="scoreBgAr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    معايير تقييم TTFB حسب معايير أداء الويب القياسية
  </text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    النسبة المئوية 75th Percentile لبيانات المستخدمين الواقعية (Field Data - CrUX)
  </text>

  <!-- Card 1: Good (0 - 800ms) -->
  <g transform="translate(680, 95)">
    <rect width="280" height="205" rx="14" fill="url(#scoreBgAr)" stroke="#22c55e" stroke-width="2"/>
    <rect x="20" y="18" width="80" height="28" rx="14" fill="#14532d"/>
    <text x="60" y="37" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="800" fill="#4ade80">جيد · Good</text>
    
    <text x="140" y="95" text-anchor="middle" font-family="system-ui, monospace" font-size="36" font-weight="900" fill="#22c55e">≤ 800 ms</text>
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="700" fill="#86efac">أداء ممتاز واستجابة فائقة</text>
    
    <line x1="25" y1="145" x2="255" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="140" y="172" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#cbd5e1">المتصفح يبدأ معالجة الـ HTML فورًا</text>
    <text x="140" y="192" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">تأثير مثالي على FCP و LCP</text>
  </g>

  <!-- Card 2: Needs Improvement (800ms - 1800ms) -->
  <g transform="translate(360, 95)">
    <rect width="280" height="205" rx="14" fill="url(#scoreBgAr)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="18" width="125" height="28" rx="14" fill="#78350f"/>
    <text x="82" y="37" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" font-weight="800" fill="#fcd34d">يحتاج تحسين · Ok</text>
    
    <text x="140" y="95" text-anchor="middle" font-family="system-ui, monospace" font-size="32" font-weight="900" fill="#f59e0b">800 - 1800ms</text>
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="700" fill="#fde68a">مقبول ولكن يسبب تباطؤًا</text>
    
    <line x1="25" y1="145" x2="255" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="140" y="172" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#cbd5e1">يوجد تأخير ملحوظ في السيرفر أو الشبكة</text>
    <text x="140" y="192" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">يوصى بتفعيل الكاش وتحسين الاستعلامات</text>
  </g>

  <!-- Card 3: Poor (> 1800ms) -->
  <g transform="translate(40, 95)">
    <rect width="280" height="205" rx="14" fill="url(#scoreBgAr)" stroke="#ef4444" stroke-width="2"/>
    <rect x="20" y="18" width="85" height="28" rx="14" fill="#7f1d1d"/>
    <text x="62" y="37" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="800" fill="#f87171">ضعيف · Poor</text>
    
    <text x="140" y="95" text-anchor="middle" font-family="system-ui, monospace" font-size="36" font-weight="900" fill="#ef4444">&gt; 1800 ms</text>
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">عنق زجاجة حرج للأداء</text>
    
    <line x1="25" y1="145" x2="255" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="140" y="172" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#cbd5e1">شاشة بيضاء فارغة للمستخدمين لثوانٍ</text>
    <text x="140" y="192" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">فشل مؤكد في Core Web Vitals (LCP)</text>
  </g>
</svg>
