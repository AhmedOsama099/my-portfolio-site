<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="ttfbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="delayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="durationGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="renderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Title -->
  <text x="950" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="end">
    المراحل الأربعة المكونة لزمن LCP (تفيكيك زمن أكبر رسم للمحتوى)
  </text>
  <text x="950" y="78" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="end">
    الميزانية الزمنية المستهدفة لـ LCP: ≤ 2.5 ثانية
  </text>

  <!-- Timeline Base Bar (100% LCP) RTL -->
  <g transform="translate(50, 110)">
    <!-- Stage 1: TTFB (~40%) -->
    <rect x="540" y="0" width="360" height="50" rx="8" fill="url(#ttfbGrad)" />
    <text x="720" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. TTFB (~40%)</text>
    <text x="720" y="42" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">زمن وصول أول بايت</text>

    <!-- Stage 2: Resource Load Delay (<10%) -->
    <rect x="452" y="0" width="80" height="50" rx="8" fill="url(#delayGrad)" />
    <text x="492" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. تأخير التحميل</text>
    <text x="492" y="42" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&lt;10%</text>

    <!-- Stage 3: Resource Load Duration (~40%) -->
    <rect x="84" y="0" width="360" height="50" rx="8" fill="url(#durationGrad)" />
    <text x="264" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. مدة تحميل العنصر (~40%)</text>
    <text x="264" y="42" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">تنزيل ملف LCP عبر الشبكة</text>

    <!-- Stage 4: Element Render Delay (<10%) -->
    <rect x="0" y="0" width="76" height="50" rx="8" fill="url(#renderGrad)" />
    <text x="38" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. الرندرة</text>
    <text x="38" y="42" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&lt;10%</text>
  </g>

  <!-- Detailed Explanation Cards (RTL Layout) -->
  <g transform="translate(50, 190)">
    <!-- Box 1 (TTFB) -->
    <rect x="690" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="875" cy="28" r="10" fill="#3b82f6" />
    <text x="875" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="855" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">TTFB (~40%)</text>
    <text x="885" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• زمن استجابة السيرفر</text>
    <text x="885" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• الاتصال بشبكة DNS و TLS</text>
    <text x="885" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• المستهدف: أقل من 800ms</text>
    <text x="885" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">الحل: Edge CDN, الكاش,</text>
    <text x="885" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Brotli, HTTP/3</text>

    <!-- Box 2 (Load Delay) -->
    <rect x="460" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="645" cy="28" r="10" fill="#f59e0b" />
    <text x="645" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="625" y="32" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">تأخير التحميل (&lt;10%)</text>
    <text x="655" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• وقت اكتشاف العنصر</text>
    <text x="655" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• السكربتات وصور الخلفية</text>
    <text x="655" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• المستهدف: يقارب 0ms</text>
    <text x="655" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">الحل: إظهار المورد بالـ HTML,</text>
    <text x="655" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Preload, fetchpriority</text>

    <!-- Box 3 (Load Duration) -->
    <rect x="230" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="415" cy="28" r="10" fill="#ec4899" />
    <text x="415" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="395" y="32" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">مدة التحميل (~40%)</text>
    <text x="425" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• نقل البيانات عبر الشبكة</text>
    <text x="425" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• حجم الصور أو الخطوط</text>
    <text x="425" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• النطاق الترددي للشبكة</text>
    <text x="425" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">الحل: WebP/AVIF, srcset,</text>
    <text x="425" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">WOFF2, الضغط الذكي</text>

    <!-- Box 4 (Render Delay) -->
    <rect x="0" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#10b981" stroke-width="1.5" />
    <circle cx="185" cy="28" r="10" fill="#10b981" />
    <text x="185" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="165" y="32" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">تأخير الرندرة (&lt;10%)</text>
    <text x="195" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• حجب الـ CSS والـ JS</text>
    <text x="195" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• مهام خيط التنفيذ الطويلة</text>
    <text x="195" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">• المستهدف: يقارب 0ms</text>
    <text x="195" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">الحل: Inline Critical CSS,</text>
    <text x="195" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Defer JS, SSR / SSG</text>
  </g>
</svg>
