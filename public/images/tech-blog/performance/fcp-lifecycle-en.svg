<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <linearGradient id="stepBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="380" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <text x="500" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    The Critical Path to FCP (First Contentful Paint)
  </text>
  <text x="500" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    From navigation start and TTFB to DOM parsing, CSSOM construction, and first visual paint
  </text>

  <!-- Step 1: Network & TTFB -->
  <g transform="translate(30, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBg)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="105" cy="38" r="20" fill="#4338ca" fill-opacity="0.25"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#818cf8">1</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Network &amp; TTFB</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">DNS, TCP &amp; TLS Handshake</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Server processing (SSR/DB)</text>
    <rect x="20" y="152" width="170" height="26" rx="6" fill="#0f172a"/>
    <text x="105" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#818cf8">responseStart (1st Byte)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 200 L 270 200" stroke="url(#arrowGrad)" stroke-width="3"/>
  <polygon points="275,200 267,195 267,205" fill="#818cf8"/>

  <!-- Step 2: HTML & DOM -->
  <g transform="translate(280, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBg)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="105" cy="38" r="20" fill="#0284c7" fill-opacity="0.25"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">2</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">HTML &amp; DOM Tree</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Tokenizing HTML stream</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Preload scanner kicks in</text>
    <rect x="20" y="152" width="170" height="26" rx="6" fill="#0f172a"/>
    <text x="105" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">DOM Nodes Created</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 495 200 L 520 200" stroke="url(#arrowGrad)" stroke-width="3"/>
  <polygon points="525,200 517,195 517,205" fill="#818cf8"/>

  <!-- Step 3: CSSOM & Script Block -->
  <g transform="translate(530, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBg)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="105" cy="38" r="20" fill="#b45309" fill-opacity="0.25"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fbbf24">3</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">CSSOM &amp; Fonts</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Render-blocking CSS</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Font swap (avoid FOIT)</text>
    <rect x="20" y="152" width="170" height="26" rx="6" fill="#0f172a"/>
    <text x="105" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">Render Tree Ready</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 745 200 L 770 200" stroke="url(#arrowGrad)" stroke-width="3"/>
  <polygon points="775,200 767,195 767,205" fill="#10b981"/>

  <!-- Step 4: Layout & FCP -->
  <g transform="translate(780, 100)">
    <rect width="190" height="200" rx="12" fill="url(#stepBg)" stroke="#10b981" stroke-width="2"/>
    <circle cx="95" cy="38" r="20" fill="#059669" fill-opacity="0.3"/>
    <text x="95" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#34d399">4</text>
    <text x="95" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34d399">Layout &amp; FCP ⚡</text>
    <text x="95" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a7f3d0">Computing box geometry</text>
    <text x="95" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a7f3d0">First DOM content paints</text>
    <rect x="15" y="152" width="160" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="95" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7">FCP FIRED (≤ 1.8s)</text>
  </g>

  <!-- Footer Timeline Summary -->
  <g transform="translate(30, 320)">
    <rect width="940" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="34" rx="8" fill="#4338ca" fill-opacity="0.4"/>
    <text x="120" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">TTFB Phase (Network &amp; Server)</text>
    <rect x="240" y="0" width="700" height="34" rx="8" fill="#059669" fill-opacity="0.4"/>
    <text x="590" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Browser Parsing, Styling, &amp; Painting → Total Time = FCP</text>
  </g>
</svg>
