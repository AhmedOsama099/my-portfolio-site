<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="ttfbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="delayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="durationGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="renderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Title -->
  <text x="50" y="50" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">
    The 4 Subparts of Largest Contentful Paint (LCP Breakdown)
  </text>
  <text x="50" y="78" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Total LCP Time Budget Target: ≤ 2.5 Seconds
  </text>

  <!-- Timeline Base Bar (100% LCP) -->
  <g transform="translate(50, 110)">
    <!-- Stage 1: TTFB (~40%) -->
    <rect x="0" y="0" width="360" height="50" rx="8" fill="url(#ttfbGrad)" />
    <text x="180" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. TTFB (~40%)</text>
    <text x="180" y="42" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Time to First Byte</text>

    <!-- Stage 2: Resource Load Delay (<10%) -->
    <rect x="368" y="0" width="80" height="50" rx="8" fill="url(#delayGrad)" />
    <text x="408" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Delay</text>
    <text x="408" y="42" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&lt;10%</text>

    <!-- Stage 3: Resource Load Duration (~40%) -->
    <rect x="456" y="0" width="360" height="50" rx="8" fill="url(#durationGrad)" />
    <text x="636" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Load Duration (~40%)</text>
    <text x="636" y="42" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Downloading LCP Asset</text>

    <!-- Stage 4: Element Render Delay (<10%) -->
    <rect x="824" y="0" width="76" height="50" rx="8" fill="url(#renderGrad)" />
    <text x="862" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Render</text>
    <text x="862" y="42" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">&lt;10%</text>
  </g>

  <!-- Detailed Explanation Cards -->
  <g transform="translate(50, 190)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="25" cy="28" r="10" fill="#3b82f6" />
    <text x="25" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="45" y="32" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="700">TTFB (~40%)</text>
    <text x="15" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Server response time</text>
    <text x="15" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Network RTT &amp; TLS</text>
    <text x="15" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Target: &lt; 800ms</text>
    <text x="15" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Fix: Edge CDN, Caching,</text>
    <text x="15" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Brotli, HTTP/3</text>

    <!-- Box 2 -->
    <rect x="230" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="255" cy="28" r="10" fill="#f59e0b" />
    <text x="255" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="275" y="32" fill="#fde68a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Load Delay (&lt;10%)</text>
    <text x="245" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Time to discover asset</text>
    <text x="245" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Dynamic JS / CSS url()</text>
    <text x="245" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Target: ~0ms</text>
    <text x="245" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Fix: HTML discoverable,</text>
    <text x="245" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Preload, fetchpriority="high"</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="485" cy="28" r="10" fill="#ec4899" />
    <text x="485" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="505" y="32" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Load Duration (~40%)</text>
    <text x="475" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Transferring bytes</text>
    <text x="475" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Image / Font size</text>
    <text x="475" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Network bandwidth</text>
    <text x="475" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Fix: WebP/AVIF, srcset,</text>
    <text x="475" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">WOFF2, compression</text>

    <!-- Box 4 -->
    <rect x="690" y="0" width="210" height="190" rx="10" fill="#1f2937" stroke="#10b981" stroke-width="1.5" />
    <circle cx="715" cy="28" r="10" fill="#10b981" />
    <text x="715" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="735" y="32" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Render Delay (&lt;10%)</text>
    <text x="705" y="62" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Render blocking CSS/JS</text>
    <text x="705" y="82" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Main-thread long tasks</text>
    <text x="705" y="102" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="12">• Target: ~0ms</text>
    <text x="705" y="132" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Fix: Inline Critical CSS,</text>
    <text x="705" y="148" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Defer JS, SSR / SSG</text>
  </g>
</svg>
