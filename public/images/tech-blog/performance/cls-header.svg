<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="shiftAlertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="220" cy="140" r="190" fill="#f43f5e" opacity="0.13" filter="url(#glow)" />
  <circle cx="980" cy="300" r="220" fill="#f59e0b" opacity="0.14" filter="url(#glow)" />
  <circle cx="620" cy="240" r="200" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.2">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 95)">
    <!-- Badge -->
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#10b981" />
    <text x="34" y="22" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CORE WEB VITAL</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">
      Cumulative Layout Shift
    </text>
    <text x="0" y="125" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      (CLS) Deep Dive
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      The definitive measure of page visual stability &amp; layout predictability.
    </text>
    <text x="0" y="196" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Session Windows, Layout Calculus, &amp; Zero-Shift Architecture.
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="130" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="20" y="26" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Good ≤ 0.1</text>

      <rect x="145" y="0" width="160" height="42" rx="10" fill="#431407" stroke="#ea580c" stroke-width="1" />
      <text x="160" y="26" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Impact × Distance</text>

      <rect x="320" y="0" width="140" height="42" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="335" y="26" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">CrUX / RUM</text>
    </g>
  </g>

  <!-- Right Side: Layout Shift Visual Representation -->
  <g transform="translate(680, 75)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="450" height="330" rx="16" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />

    <!-- Browser Controls -->
    <rect x="0" y="0" width="450" height="40" rx="16" fill="#111827" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="80" y="10" width="290" height="20" rx="6" fill="#1f2937" />
    <text x="145" y="24" fill="#9ca3af" font-family="monospace" font-size="11">https://your-site.com/cls</text>

    <!-- Navigation Header in Viewport -->
    <rect x="25" y="55" width="90" height="12" rx="4" fill="#38bdf8" />
    <rect x="345" y="56" width="35" height="9" rx="3" fill="#4b5563" />
    <rect x="390" y="56" width="35" height="9" rx="3" fill="#4b5563" />

    <!-- Page Title -->
    <rect x="25" y="78" width="170" height="12" rx="3" fill="#f3f4f6" />

    <!-- Late Injected Ad / Unsized Banner (Causes Shift) -->
    <g transform="translate(25, 102)">
      <rect x="0" y="0" width="400" height="58" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" />
      <circle cx="20" cy="29" r="9" fill="#f59e0b" />
      <text x="16" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900">!</text>
      <text x="38" y="25" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Late Dynamic Insertion (No Reserved Space)</text>
      <text x="38" y="43" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10">Pushes all DOM content below by +65px</text>
    </g>

    <!-- Shift Vector & Ghost Position (Previous Frame) -->
    <rect x="25" y="102" width="400" height="42" rx="6" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />
    
    <!-- Shift Indicator Arrow -->
    <g transform="translate(400, 166)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ef4444" stroke-width="2.5" />
      <polygon points="-4,26 4,26 0,33" fill="#ef4444" />
      <text x="-32" y="16" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">Δy</text>
    </g>

    <!-- Shifted Content Block (Frame 2 - Unstable Element) -->
    <g transform="translate(25, 172)">
      <!-- Highlighted Impact Area -->
      <rect x="0" y="0" width="395" height="85" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" />
      <rect x="15" y="15" width="220" height="12" rx="3" fill="#fca5a5" />
      <rect x="15" y="35" width="350" height="9" rx="3" fill="#9ca3af" />
      <rect x="15" y="50" width="320" height="9" rx="3" fill="#9ca3af" />
      <rect x="15" y="65" width="270" height="9" rx="3" fill="#6b7280" />

      <!-- Shift Tag inside impacted block -->
      <g transform="translate(240, 10)">
        <rect x="0" y="0" width="145" height="24" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1" />
        <text x="10" y="16" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚠️ Shifted Element</text>
      </g>
    </g>

    <!-- Bottom Status Ribbon: Session Window & Score -->
    <g transform="translate(25, 274)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="14" y="17" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SESSION WINDOW</text>
      <text x="14" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Gap &lt; 1s · Max 5s</text>

      <rect x="215" y="0" width="185" height="40" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="230" cy="20" r="5" fill="#34d399" />
      <text x="242" y="17" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TARGET SCORE</text>
      <text x="242" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">CLS ≤ 0.1 (Good)</text>
    </g>
  </g>
</svg>
