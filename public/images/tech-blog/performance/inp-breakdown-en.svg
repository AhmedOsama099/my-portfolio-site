<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="delayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="paintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1000" height="460" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="45" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">
    The Anatomical Breakdown of an Interaction (INP)
  </text>
  <text x="45" y="70" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Total Interaction Latency = Input Delay + Processing Duration + Presentation Delay · Good: ≤ 200ms
  </text>

  <!-- Main Timeline Visual (Top Section) -->
  <g transform="translate(45, 95)">
    <!-- Container Card -->
    <rect x="0" y="0" width="910" height="150" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" />

    <!-- User Gesture Start Marker -->
    <g transform="translate(30, 25)">
      <circle cx="20" cy="20" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <text x="13" y="26" fill="#c7d2fe" font-size="14">👆</text>
      <text x="48" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">User Gesture Initiated</text>
      <text x="48" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">pointerdown / keydown / click</text>
    </g>

    <!-- Phase 1 Bar: Input Delay -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="230" height="36" rx="6" fill="url(#delayGrad)" />
      <text x="14" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. INPUT DELAY</text>
      <text x="140" y="22" fill="#fef3c7" font-family="monospace" font-size="11">(Queue Wait)</text>
      <text x="0" y="52" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">Main thread busy running long tasks</text>
    </g>

    <!-- Phase 2 Bar: Processing Duration -->
    <g transform="translate(270, 75)">
      <rect x="0" y="0" width="340" height="36" rx="6" fill="url(#procGrad)" />
      <text x="14" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. PROCESSING DURATION</text>
      <text x="195" y="22" fill="#e0e7ff" font-family="monospace" font-size="11">(Callbacks Execution)</text>
      <text x="0" y="52" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">Event listeners run (pointerup, click, React handlers)</text>
    </g>

    <!-- Phase 3 Bar: Presentation Delay -->
    <g transform="translate(620, 75)">
      <rect x="0" y="0" width="220" height="36" rx="6" fill="url(#paintGrad)" />
      <text x="12" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. PRESENTATION</text>
      <text x="135" y="22" fill="#cffafe" font-family="monospace" font-size="11">(Next Paint)</text>
      <text x="0" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Recalculate Style, Layout, Paint next frame</text>
    </g>

    <!-- Next Paint Flag -->
    <g transform="translate(850, 68)">
      <polygon points="0,0 20,10 0,20" fill="#10b981" />
      <line x1="0" y1="0" x2="0" y2="45" stroke="#10b981" stroke-width="2" />
      <text x="25" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">FRAME PAINTED</text>
    </g>
  </g>

  <!-- Bottom Section: FID vs INP Comparison & Triggers -->
  <g transform="translate(45, 270)">
    <!-- Card 1: FID vs INP Architecture -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="445" height="160" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" />
      <text x="20" y="28" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">FID (Legacy) vs. INP (Modern Core Web Vital)</text>

      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1" />
        <text x="12" y="22" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="700">FID (First Input Delay)</text>
        <text x="12" y="42" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">• Only measured 1st interaction</text>
        <text x="12" y="60" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">• Only measured Input Delay</text>
        <text x="12" y="78" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">• Ignored event execution &amp; paint</text>
        <text x="12" y="93" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="800">⛔ DEPRECATED MARCH 2024</text>
      </g>

      <g transform="translate(230, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="12" y="22" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INP (Interaction to Next Paint)</text>
        <text x="12" y="42" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">• Tracks ALL interactions</text>
        <text x="12" y="60" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">• End-to-end (Delay + Exec + Paint)</text>
        <text x="12" y="78" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">• Reports worst 98th percentile</text>
        <text x="12" y="93" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="800">✅ OFFICIAL RANKING FACTOR</text>
      </g>
    </g>

    <!-- Card 2: Eligible vs Excluded Actions -->
    <g transform="translate(465, 0)">
      <rect x="0" y="0" width="445" height="160" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" />
      <text x="20" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">What Counts as an Interaction for INP?</text>

      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="12" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✅ Measured by INP</text>
        <text x="12" y="42" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">🖱️ Mouse Click &amp; Pointer Up</text>
        <text x="12" y="60" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">📱 Touchscreen Tap &amp; Release</text>
        <text x="12" y="78" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">⌨️ Physical/Onscreen Keystroke</text>
        <text x="12" y="94" fill="#818cf8" font-family="monospace" font-size="10">Logical User Gestures</text>
      </g>

      <g transform="translate(230, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#27272a" stroke="#71717a" stroke-width="1" />
        <text x="12" y="22" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🚫 Excluded from INP</text>
        <text x="12" y="42" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">📜 Page Scrolling / Panning</text>
        <text x="12" y="60" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">🔍 Pinching &amp; Zooming</text>
        <text x="12" y="78" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">🤖 Bot &amp; Headless crawler visits</text>
        <text x="12" y="94" fill="#a1a1aa" font-family="monospace" font-size="10">{ passive: true } won't fix INP</text>
      </g>
    </g>
  </g>
</svg>
