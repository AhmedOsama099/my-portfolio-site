<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="imageHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="220" cy="140" r="190" fill="#f59e0b" opacity="0.14" filter="url(#glow)" />
  <circle cx="980" cy="320" r="210" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="240" r="230" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="1" opacity="0.2">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#10b981" />
    <text x="34" y="22" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CORE WEB VITAL</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">
      Largest Contentful Paint
    </text>
    <text x="0" y="125" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      (LCP) Deep Dive
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      The definitive measure of user-perceived loading speed.
    </text>
    <text x="0" y="196" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      4-Subpart Breakdown, Fetch Priority, &amp; Asset Optimization.
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="130" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="20" y="26" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Good ≤ 2.5s</text>

      <rect x="145" y="0" width="150" height="42" rx="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
      <text x="160" y="26" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">25% Lighthouse</text>

      <rect x="310" y="0" width="140" height="42" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1" />
      <text x="325" y="26" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">CrUX / RUM</text>
    </g>
  </g>

  <!-- Right Side: Interactive Hero Element Visual -->
  <g transform="translate(680, 80)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="440" height="320" rx="16" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    
    <!-- Browser Controls -->
    <rect x="0" y="0" width="440" height="40" rx="16" fill="#111827" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="56" cy="20" r="5" fill="#10b981" />
    <rect x="80" y="10" width="280" height="20" rx="6" fill="#1f2937" />
    <text x="135" y="24" fill="#9ca3af" font-family="monospace" font-size="11">https://your-site.com/lcp</text>

    <!-- Browser Viewport Content -->
    <!-- Nav bar -->
    <rect x="25" y="55" width="80" height="14" rx="4" fill="#38bdf8" />
    <rect x="330" y="57" width="35" height="10" rx="3" fill="#4b5563" />
    <rect x="375" y="57" width="35" height="10" rx="3" fill="#4b5563" />

    <!-- Text Header -->
    <rect x="25" y="82" width="180" height="14" rx="3" fill="#f3f4f6" />

    <!-- LARGEST CONTENTFUL ELEMENT (Hero Banner Image) with Active Outline -->
    <rect x="25" y="106" width="390" height="155" rx="10" fill="url(#imageHeroGrad)" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4" />
    
    <!-- Sun and mountains visual inside hero image -->
    <circle cx="100" cy="150" r="22" fill="#fef08a" opacity="0.9" />
    <path d="M 45 235 L 140 160 L 210 215 L 290 145 L 395 235 Z" fill="#1e1b4b" opacity="0.75" />
    
    <!-- LCP Target Tag -->
    <g transform="translate(145, 160)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#0f172a" opacity="0.9" stroke="#fbbf24" stroke-width="1.5" />
      <text x="14" y="20" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🎯 LCP Candidate</text>
    </g>

    <!-- Secondary Text lines below hero -->
    <rect x="25" y="272" width="240" height="10" rx="3" fill="#4b5563" />
    <rect x="25" y="290" width="180" height="10" rx="3" fill="#374151" />

    <!-- Stamp: LCP REPORTED -->
    <g transform="translate(250, 260)">
      <rect x="0" y="0" width="165" height="40" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5" filter="url(#glow)" />
      <circle cx="18" cy="20" r="5" fill="#34d399" />
      <text x="32" y="24" fill="#ecfdf5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">LCP READY: 1.4s</text>
    </g>
  </g>
</svg>
