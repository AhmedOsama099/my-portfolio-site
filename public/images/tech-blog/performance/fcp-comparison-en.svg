<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <defs>
    <linearGradient id="bgComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1000" height="480" rx="16" fill="url(#bgComp)" />

  <!-- Title -->
  <text x="500" y="45" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">
    Visual Progression: FP vs. FCP vs. LCP
  </text>
  <text x="500" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    How the browser paints the page over time and when each key milestone fires
  </text>

  <!-- Step 1: Blank Screen -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="200" height="260" rx="12" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    <!-- Browser bar -->
    <rect width="200" height="28" rx="12" fill="#1e293b" />
    <circle cx="15" cy="14" r="3.5" fill="#ef4444" />
    <circle cx="27" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="39" cy="14" r="3.5" fill="#10b981" />
    <!-- Empty body -->
    <text x="100" y="150" fill="#475569" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Blank Screen</text>
    <text x="100" y="170" fill="#334155" font-family="monospace" font-size="11" text-anchor="middle">Parsing HTML...</text>
    <!-- Label -->
    <rect x="25" y="275" width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="100" y="297" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0.0s — Initial Request</text>
  </g>

  <!-- Step 2: FP (First Paint) -->
  <g transform="translate(275, 100)" filter="url(#shadow)">
    <rect width="200" height="260" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <!-- Browser bar -->
    <rect width="200" height="28" rx="12" fill="#312e81" />
    <circle cx="15" cy="14" r="3.5" fill="#ef4444" />
    <circle cx="27" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="39" cy="14" r="3.5" fill="#10b981" />
    <!-- Background only rendered -->
    <rect x="15" y="45" width="170" height="200" rx="6" fill="#1e1b4b" />
    <text x="100" y="145" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">Background Color</text>
    <text x="100" y="165" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">(No Eligible Content)</text>
    <!-- Label -->
    <rect x="20" y="275" width="160" height="34" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1" />
    <text x="100" y="297" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FP (First Paint): ~0.5s</text>
  </g>

  <!-- Step 3: FCP (First Contentful Paint) - HIGHLIGHTED -->
  <g transform="translate(510, 90)" filter="url(#shadow)">
    <rect width="215" height="275" rx="12" fill="#042f2e" stroke="#10b981" stroke-width="2.5" />
    <!-- Browser bar -->
    <rect width="215" height="28" rx="12" fill="#065f46" />
    <circle cx="15" cy="14" r="3.5" fill="#ef4444" />
    <circle cx="27" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="39" cy="14" r="3.5" fill="#10b981" />
    <!-- Nav logo + Heading rendered -->
    <circle cx="25" cy="45" r="7" fill="#34d399" />
    <rect x="38" y="41" width="45" height="8" rx="2" fill="#e2e8f0" />
    <!-- Text painted! -->
    <rect x="15" y="68" width="130" height="12" rx="3" fill="#ffffff" />
    <rect x="15" y="86" width="170" height="8" rx="2" fill="#94a3b8" />
    <rect x="15" y="99" width="140" height="8" rx="2" fill="#64748b" />
    <!-- Button painted -->
    <rect x="15" y="120" width="60" height="18" rx="4" fill="#059669" />
    <!-- Empty image placeholder -->
    <rect x="15" y="150" width="185" height="95" rx="6" fill="#0f172a" stroke="#0d9488" stroke-dasharray="3,3" />
    <text x="107" y="202" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Loading Hero Media...</text>
    <!-- Label -->
    <rect x="15" y="290" width="185" height="38" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    <text x="107" y="314" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">FCP FIRED: ~0.9s ⚡</text>
  </g>

  <!-- Step 4: LCP (Largest Contentful Paint) -->
  <g transform="translate(755, 100)" filter="url(#shadow)">
    <rect width="205" height="260" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Browser bar -->
    <rect width="205" height="28" rx="12" fill="#0369a1" />
    <circle cx="15" cy="14" r="3.5" fill="#ef4444" />
    <circle cx="27" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="39" cy="14" r="3.5" fill="#10b981" />
    <!-- Full page rendered with Hero Image -->
    <circle cx="25" cy="45" r="7" fill="#38bdf8" />
    <rect x="38" y="41" width="45" height="8" rx="2" fill="#e2e8f0" />
    <rect x="15" y="68" width="130" height="12" rx="3" fill="#ffffff" />
    <rect x="15" y="86" width="170" height="8" rx="2" fill="#94a3b8" />
    <!-- Hero Image FULLY RENDERED -->
    <rect x="15" y="105" width="175" height="120" rx="6" fill="#0284c7" />
    <path d="M 30 190 L 65 140 L 95 170 L 135 125 L 175 190 Z" fill="#075985" />
    <circle cx="65" cy="130" r="10" fill="#facc15" />
    <!-- Label -->
    <rect x="20" y="275" width="165" height="34" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
    <text x="102" y="297" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">LCP (Largest): ~1.6s</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(150, 435)">
    <text x="350" y="15" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
      <tspan fill="#818cf8" font-weight="700">FP</tspan> = any pixel drawn | 
      <tspan fill="#34d399" font-weight="700">FCP</tspan> = first DOM content (text, image, SVG) | 
      <tspan fill="#38bdf8" font-weight="700">LCP</tspan> = largest visual candidate
    </text>
  </g>
</svg>
