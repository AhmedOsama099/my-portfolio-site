<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" direction="rtl">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="delayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="procGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="paintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1000" height="460" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="955" y="44" text-anchor="start" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">
    التشريح الدقيق لزمن التفاعل في مقياس INP
  </text>
  <text x="955" y="70" text-anchor="start" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    إجمالي زمن التفاعل = تأخير الإدخال + مدة المعالجة + تأخير العرض والرسم · الحد الموصى به: ≤ 200ms
  </text>

  <!-- Main Timeline Visual (Top Section) -->
  <g transform="translate(45, 95)">
    <!-- Container Card -->
    <rect x="0" y="0" width="910" height="150" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" />

    <!-- User Gesture Start Marker -->
    <g transform="translate(730, 25)">
      <circle cx="20" cy="20" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      <text x="13" y="26" fill="#c7d2fe" font-size="14">👆</text>
      <text x="-15" y="24" text-anchor="end" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">بداية تفاعل المستخدم</text>
      <text x="-15" y="40" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">pointerdown / keydown / click</text>
    </g>

    <!-- Phase 1 Bar: Input Delay -->
    <g transform="translate(640, 75)">
      <rect x="0" y="0" width="230" height="36" rx="6" fill="url(#delayGrad)" />
      <text x="215" y="22" text-anchor="end" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. تأخير الإدخال (Input Delay)</text>
      <text x="230" y="52" text-anchor="end" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">انتظار خيط التنفيذ (Main Thread) بسبب المهام الطويلة</text>
    </g>

    <!-- Phase 2 Bar: Processing Duration -->
    <g transform="translate(280, 75)">
      <rect x="0" y="0" width="340" height="36" rx="6" fill="url(#procGrad)" />
      <text x="320" y="22" text-anchor="end" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. مدة المعالجة (Processing Duration)</text>
      <text x="340" y="52" text-anchor="end" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">تنفيذ دوال الأحداث وكود الجافاسكربت (Event Listeners)</text>
    </g>

    <!-- Phase 3 Bar: Presentation Delay -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="220" height="36" rx="6" fill="url(#paintGrad)" />
      <text x="205" y="22" text-anchor="end" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. تأخير العرض (Presentation)</text>
      <text x="220" y="52" text-anchor="end" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">حساب التنسيق والرسم للإطار التالي (Next Paint)</text>
    </g>

    <!-- Next Paint Flag -->
    <g transform="translate(20, 68)">
      <polygon points="0,0 20,10 0,20" fill="#10b981" />
      <line x1="0" y1="0" x2="0" y2="45" stroke="#10b981" stroke-width="2" />
      <text x="5" y="-5" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">رسم الإطار التالي</text>
    </g>
  </g>

  <!-- Bottom Section: FID vs INP Comparison & Triggers -->
  <g transform="translate(45, 270)">
    <!-- Card 1: FID vs INP Architecture -->
    <g transform="translate(465, 0)">
      <rect x="0" y="0" width="445" height="160" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" />
      <text x="425" y="28" text-anchor="end" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">المقارنة بين FID القديم و INP الحديث</text>

      <g transform="translate(230, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1" />
        <text x="180" y="22" text-anchor="end" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="700">FID (المقياس القديم)</text>
        <text x="180" y="42" text-anchor="end" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">• يقيس أول تفاعل فقط في الزيارة</text>
        <text x="180" y="60" text-anchor="end" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">• يقيس تأخير الإدخال فقط</text>
        <text x="180" y="78" text-anchor="end" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11">• يتجاهل وقت المعالجة والرسم</text>
        <text x="180" y="93" text-anchor="end" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="800">⛔ تم إيقافه رسمياً في 2024</text>
      </g>

      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="180" y="22" text-anchor="end" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INP (المعيار المعتمد حالياً)</text>
        <text x="180" y="42" text-anchor="end" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">• يرصد جميع التفاعلات طوال الجلسة</text>
        <text x="180" y="60" text-anchor="end" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">• يقيس الدورة كاملة حتى رسم الإطار</text>
        <text x="180" y="78" text-anchor="end" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">• يحتسب أسوأ تفاعل (الشريحة 98)</text>
        <text x="180" y="93" text-anchor="end" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="800">✅ مقياس أساسي في الترتيب</text>
      </g>
    </g>

    <!-- Card 2: Eligible vs Excluded Actions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="445" height="160" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1" />
      <text x="425" y="28" text-anchor="end" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ما الذي يُحتسب كتفاعل في INP؟</text>

      <g transform="translate(230, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="180" y="22" text-anchor="end" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✅ يُحتسب في INP</text>
        <text x="180" y="42" text-anchor="end" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">🖱️ نقرة الماوس (Click)</text>
        <text x="180" y="60" text-anchor="end" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">📱 لمس شاشات اللمس (Tap)</text>
        <text x="180" y="78" text-anchor="end" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">⌨️ الضغط على لوحة المفاتيح</text>
        <text x="180" y="94" text-anchor="end" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10">إيماءات منطقية يقودها المستخدم</text>
      </g>

      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="195" height="98" rx="8" fill="#27272a" stroke="#71717a" stroke-width="1" />
        <text x="180" y="22" text-anchor="end" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🚫 مستبعد من INP</text>
        <text x="180" y="42" text-anchor="end" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">📜 التمرير (Scroll / Pan)</text>
        <text x="180" y="60" text-anchor="end" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">🔍 التقريب والتكبير (Zoom)</text>
        <text x="180" y="78" text-anchor="end" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">🤖 زيارات الروبوتات والعناكب</text>
        <text x="180" y="94" text-anchor="end" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">التمرير لا يؤثر على درجة INP</text>
      </g>
    </g>
  </g>
</svg>
