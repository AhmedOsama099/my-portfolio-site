<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="phase1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="phase2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="phase3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="130" r="180" fill="#6366f1" opacity="0.14" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="210" fill="#06b6d4" opacity="0.14" filter="url(#glow)" />
  <circle cx="650" cy="220" r="190" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.22">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 95)">
    <!-- Badge -->
    <rect x="0" y="0" width="250" height="34" rx="17" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#10b981" />
    <text x="34" y="22" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CORE WEB VITAL (2024+)</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">
      Interaction to Next Paint
    </text>
    <text x="0" y="125" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
      (INP) Deep Dive
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      The definitive Core Web Vital assessing full-session responsiveness.
    </text>
    <text x="0" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Input Delay, Event Processing, &amp; Presentation Paint Optimization.
    </text>

    <!-- Stat Pills -->
    <g transform="translate(0, 230)">
      <!-- Good -->
      <rect x="0" y="0" width="135" height="42" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="20" y="26" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">≤ 200ms GOOD</text>

      <!-- Needs Improvement -->
      <rect x="148" y="0" width="165" height="42" rx="10" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="165" y="26" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">200–500ms NEEDS IMP</text>

      <!-- Poor -->
      <rect x="325" y="0" width="130" height="42" rx="10" fill="#4c0519" stroke="#f43f5e" stroke-width="1" />
      <text x="345" y="26" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="13" font-weight="700">&gt; 500ms POOR</text>
    </g>
  </g>

  <!-- Right Side: Interaction Lifecycle Diagram Card -->
  <g transform="translate(680, 75)">
    <!-- Main Card Body -->
    <rect x="0" y="0" width="440" height="330" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />

    <!-- Card Window Header -->
    <rect x="0" y="0" width="440" height="42" rx="16" fill="#0f172a" />
    <path d="M 0 32 L 0 42 L 440 42 L 440 32 Z" fill="#0f172a" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5" fill="#10b981" />
    <text x="82" y="26" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="600">INP Interaction Lifecycle</text>

    <!-- Supported Gestures Row -->
    <g transform="translate(25, 58)">
      <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="10" y="17" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">👆 Click</text>

      <rect x="95" y="0" width="85" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="107" y="17" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📱 Tap</text>

      <rect x="190" y="0" width="95" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="199" y="17" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⌨️ Keypress</text>

      <rect x="295" y="0" width="95" height="26" rx="6" fill="#27272a" stroke="#71717a" stroke-width="1" />
      <text x="303" y="17" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" font-weight="600">🚫 Scroll (No)</text>
    </g>

    <!-- Phase 1: Input Delay -->
    <g transform="translate(25, 102)">
      <rect x="0" y="0" width="115" height="65" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5" />
      <text x="12" y="24" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">1. INPUT DELAY</text>
      <text x="12" y="42" fill="#bfdbfe" font-family="monospace" font-size="10">Waiting for thread</text>
      <text x="12" y="55" fill="#60a5fa" font-family="monospace" font-size="9">Long tasks queue</text>
    </g>

    <text x="146" y="139" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">→</text>

    <!-- Phase 2: Processing Duration -->
    <g transform="translate(162, 102)">
      <rect x="0" y="0" width="125" height="65" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
      <text x="10" y="24" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">2. PROCESSING</text>
      <text x="10" y="42" fill="#f3e8ff" font-family="monospace" font-size="10">JS Event callbacks</text>
      <text x="10" y="55" fill="#c084fc" font-family="monospace" font-size="9">Execution duration</text>
    </g>

    <text x="294" y="139" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">→</text>

    <!-- Phase 3: Presentation Delay -->
    <g transform="translate(310, 102)">
      <rect x="0" y="0" width="105" height="65" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" />
      <text x="8" y="24" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3. PRESENTATION</text>
      <text x="8" y="42" fill="#ccfbf1" font-family="monospace" font-size="10">Recalc &amp; Layout</text>
      <text x="8" y="55" fill="#2dd4bf" font-family="monospace" font-size="9">Paint next frame</text>
    </g>

    <!-- Total INP Duration Banner -->
    <g transform="translate(25, 185)">
      <rect x="0" y="0" width="390" height="48" rx="8" fill="#030712" stroke="#6366f1" stroke-width="1" />
      <text x="20" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Total Interaction Latency Formula:</text>
      <text x="20" y="38" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="700">Input Delay + Processing Duration + Presentation Delay</text>
    </g>

    <!-- Bottom Status Card -->
    <g transform="translate(25, 248)">
      <rect x="0" y="0" width="390" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="28" cy="30" r="12" fill="#10b981" opacity="0.2" />
      <circle cx="28" cy="30" r="6" fill="#34d399" />
      <text x="50" y="27" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">FID RETIRED → INP IS THE OFFICIAL STANDARD</text>
      <text x="50" y="45" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Evaluates all interactions across full session, not just first click.</text>
    </g>
  </g>
</svg>
