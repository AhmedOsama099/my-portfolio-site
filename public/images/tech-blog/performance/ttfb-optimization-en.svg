<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="optBgEn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    Comprehensive Strategies to Optimize TTFB (Engineering Checklist)
  </text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Actionable architectural steps to bring initial response times under 800ms
  </text>

  <!-- Pillar 1: Edge & Network -->
  <g transform="translate(40, 95)">
    <rect width="220" height="230" rx="12" fill="url(#optBgEn)" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="110" cy="38" r="22" fill="#14532d"/>
    <text x="110" y="44" text-anchor="middle" font-family="system-ui" font-size="16">🚀</text>
    <text x="110" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#86efac">1. Edge &amp; Network</text>
    <line x1="20" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Geo-distributed CDN POPs</text>
    <text x="24" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ HTTP/3 &amp; QUIC 0-RTT</text>
    <text x="24" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ TLS 1.3 Session Resumption</text>
    <text x="24" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ 103 Early Hints for preloads</text>
  </g>

  <!-- Pillar 2: Multitier Caching -->
  <g transform="translate(280, 95)">
    <rect width="220" height="230" rx="12" fill="url(#optBgEn)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="110" cy="38" r="22" fill="#0369a1"/>
    <text x="110" y="44" text-anchor="middle" font-family="system-ui" font-size="16">💾</text>
    <text x="110" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#7dd3fc">2. Caching Tiers</text>
    <line x1="20" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Edge HTML caching</text>
    <text x="24" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ stale-while-revalidate</text>
    <text x="24" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Redis / Memcached in-memory</text>
    <text x="24" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Internal microservice cache</text>
  </g>

  <!-- Pillar 3: Database & Backend -->
  <g transform="translate(520, 95)">
    <rect width="220" height="230" rx="12" fill="url(#optBgEn)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="110" cy="38" r="22" fill="#78350f"/>
    <text x="110" y="44" text-anchor="middle" font-family="system-ui" font-size="16">⚙️</text>
    <text x="110" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#fde68a">3. Database Tuning</text>
    <line x1="20" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Proper database indexing</text>
    <text x="24" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Parallel I/O via Promise.all</text>
    <text x="24" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Connection pooling</text>
    <text x="24" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Lean projected fields</text>
  </g>

  <!-- Pillar 4: Modern Rendering -->
  <g transform="translate(760, 95)">
    <rect width="220" height="230" rx="12" fill="url(#optBgEn)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="110" cy="38" r="22" fill="#581c87"/>
    <text x="110" y="44" text-anchor="middle" font-family="system-ui" font-size="16">✨</text>
    <text x="110" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#e9d5ff">4. Rendering Strategy</text>
    <line x1="20" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Streaming SSR (immediate flush)</text>
    <text x="24" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ React Suspense boundaries</text>
    <text x="24" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Static Pre-rendering SSG / ISR</text>
    <text x="24" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">✓ Defer non-critical widgets</text>
  </g>
</svg>
