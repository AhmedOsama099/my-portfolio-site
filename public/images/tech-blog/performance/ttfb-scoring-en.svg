<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340">
  <defs>
    <linearGradient id="scoreBgEn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    TTFB Threshold Benchmarks &amp; Scoring Guidance
  </text>
  <text x="500" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    75th Percentile evaluated across mobile &amp; desktop real-world users (CrUX Field Data)
  </text>

  <!-- Card 1: Good (0 - 800ms) -->
  <g transform="translate(40, 95)">
    <rect width="280" height="205" rx="14" fill="url(#scoreBgEn)" stroke="#22c55e" stroke-width="2"/>
    <rect x="20" y="18" width="60" height="28" rx="14" fill="#14532d"/>
    <text x="50" y="37" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#4ade80">Good</text>
    
    <text x="140" y="95" text-anchor="middle" font-family="monospace" font-size="36" font-weight="900" fill="#22c55e">≤ 800 ms</text>
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#86efac">Optimal Server Response</text>
    
    <line x1="25" y1="145" x2="255" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="140" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Browser starts parsing HTML quickly</text>
    <text x="140" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Strong foundation for FCP &amp; LCP</text>
  </g>

  <!-- Card 2: Needs Improvement (800ms - 1800ms) -->
  <g transform="translate(360, 95)">
    <rect width="280" height="205" rx="14" fill="url(#scoreBgEn)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="18" width="135" height="28" rx="14" fill="#78350f"/>
    <text x="87" y="37" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fcd34d">Needs Improvement</text>
    
    <text x="140" y="95" text-anchor="middle" font-family="monospace" font-size="30" font-weight="900" fill="#f59e0b">800 - 1800ms</text>
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fde68a">Noticeable Latency</text>
    
    <line x1="25" y1="145" x2="255" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="140" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Backend processing or network delays</text>
    <text x="140" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Review caching, CDN &amp; database queries</text>
  </g>

  <!-- Card 3: Poor (> 1800ms) -->
  <g transform="translate(680, 95)">
    <rect width="280" height="205" rx="14" fill="url(#scoreBgEn)" stroke="#ef4444" stroke-width="2"/>
    <rect x="20" y="18" width="55" height="28" rx="14" fill="#7f1d1d"/>
    <text x="47" y="37" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#f87171">Poor</text>
    
    <text x="140" y="95" text-anchor="middle" font-family="monospace" font-size="36" font-weight="900" fill="#ef4444">&gt; 1800 ms</text>
    <text x="140" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Severe Performance Bottleneck</text>
    
    <line x1="25" y1="145" x2="255" y2="145" stroke="#334155" stroke-width="1"/>
    <text x="140" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Prolonged blank white screen</text>
    <text x="140" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Guarantees poor Core Web Vitals score</text>
  </g>
</svg>
