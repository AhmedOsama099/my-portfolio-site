<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" dir="rtl">
  <defs>
    <linearGradient id="stepBgAr" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowGradAr" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="380" rx="16" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <text x="500" y="45" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    المسار الحرج للوصول إلى FCP (First Contentful Paint)
  </text>
  <text x="500" y="70" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    من بداية التنقل ووصول أول بايت TTFB إلى تحليل الـ DOM وبناء الـ CSSOM والرسم الفعلي
  </text>

  <!-- Step 1: Network & TTFB (Rightmost in RTL) -->
  <g transform="translate(760, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBgAr)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="105" cy="38" r="20" fill="#4338ca" fill-opacity="0.25"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#818cf8">1</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">الشبكة و TTFB</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">مصافحة DNS و TCP و TLS</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">معالجة السيرفر والداتابيز</text>
    <rect x="20" y="152" width="170" height="26" rx="6" fill="#0f172a"/>
    <text x="105" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#818cf8">وصول أول بايت (responseStart)</text>
  </g>

  <!-- Arrow 1 (Points left in RTL) -->
  <path d="M 755 200 L 730 200" stroke="url(#arrowGradAr)" stroke-width="3"/>
  <polygon points="725,200 733,195 733,205" fill="#818cf8"/>

  <!-- Step 2: HTML & DOM -->
  <g transform="translate(510, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBgAr)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="105" cy="38" r="20" fill="#0284c7" fill-opacity="0.25"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">2</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">تحليل HTML و DOM</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">قراءة بايتات كود الـ HTML</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">اكتشاف الموارد باكرًا (Preload)</text>
    <rect x="20" y="152" width="170" height="26" rx="6" fill="#0f172a"/>
    <text x="105" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">بناء عقد الـ DOM Tree</text>
  </g>

  <!-- Arrow 2 (Points left in RTL) -->
  <path d="M 505 200 L 480 200" stroke="url(#arrowGradAr)" stroke-width="3"/>
  <polygon points="475,200 483,195 483,205" fill="#818cf8"/>

  <!-- Step 3: CSSOM & Fonts -->
  <g transform="translate(260, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBgAr)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="105" cy="38" r="20" fill="#b45309" fill-opacity="0.25"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#fbbf24">3</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">شجرة CSSOM والخطوط</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">ملفات CSS تحجب الرسم</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#94a3b8">تجنب النص المخفي (FOIT)</text>
    <rect x="20" y="152" width="170" height="26" rx="6" fill="#0f172a"/>
    <text x="105" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24">اكتمال الـ Render Tree</text>
  </g>

  <!-- Arrow 3 (Points left in RTL) -->
  <path d="M 255 200 L 230 200" stroke="url(#arrowGradAr)" stroke-width="3"/>
  <polygon points="225,200 233,195 233,205" fill="#10b981"/>

  <!-- Step 4: Layout & FCP (Leftmost in RTL) -->
  <g transform="translate(10, 100)">
    <rect width="210" height="200" rx="12" fill="url(#stepBgAr)" stroke="#10b981" stroke-width="2"/>
    <circle cx="105" cy="38" r="20" fill="#059669" fill-opacity="0.3"/>
    <text x="105" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#34d399">4</text>
    <text x="105" y="78" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="15" font-weight="700" fill="#34d399">التخطيط وانطلاق FCP ⚡</text>
    <text x="105" y="105" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#a7f3d0">حساب أبعاد ومواضع الصناديق</text>
    <text x="105" y="125" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="12" fill="#a7f3d0">رسم أول محتوى بصري للـ DOM</text>
    <rect x="15" y="152" width="180" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="105" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7">انطلاق FCP (&le; 1.8s)</text>
  </g>

  <!-- Footer Timeline Summary -->
  <g transform="translate(30, 320)">
    <rect width="940" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="700" y="0" width="240" height="34" rx="8" fill="#4338ca" fill-opacity="0.4"/>
    <text x="820" y="21" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">مرحلة الـ TTFB (الشبكة والسيرفر)</text>
    <rect x="0" y="0" width="700" height="34" rx="8" fill="#059669" fill-opacity="0.4"/>
    <text x="350" y="21" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">تحليل المتصفح + التنسيق + الرسم الفعلي → إجمالي الوقت = FCP</text>
  </g>
</svg>
