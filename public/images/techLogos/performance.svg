<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="perfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Dashboard Ring -->
  <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  
  <!-- Speedometer Arc (Track) -->
  <path d="M 28 85 A 40 40 0 1 1 92 85" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Speedometer Arc (Active Fast Zone) -->
  <path d="M 28 85 A 40 40 0 1 1 85 40" fill="none" stroke="url(#perfGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Dial ticks -->
  <line x1="30" y1="78" x2="36" y2="73" stroke="#94a3b8" stroke-width="2"/>
  <line x1="32" y1="55" x2="39" y2="56" stroke="#94a3b8" stroke-width="2"/>
  <line x1="45" y1="36" x2="49" y2="43" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60" y1="28" x2="60" y2="36" stroke="#38bdf8" stroke-width="3"/>
  <line x1="75" y1="36" x2="71" y2="43" stroke="#38bdf8" stroke-width="2"/>
  <line x1="88" y1="55" x2="81" y2="56" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="78" x2="84" y2="73" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Speedometer Needle -->
  <polygon points="60,60 57,58 78,35 63,60" fill="url(#needleGrad)"/>
  
  <!-- Center Cap -->
  <circle cx="60" cy="60" r="7" fill="#f8fafc" stroke="#e11d48" stroke-width="2"/>
  
  <!-- Lightning / Speed Bolt Accent -->
  <path d="M 52 92 L 64 92 L 58 104 L 72 104 L 56 116 L 60 106 L 50 106 Z" fill="#fbbf24" opacity="0.9"/>
</svg>
