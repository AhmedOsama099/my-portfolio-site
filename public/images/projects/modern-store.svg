<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="ModernStore - Angular E-Commerce Platform">
  <defs>
    <linearGradient id="msBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="msCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="msAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="msShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#msBg)"/>
  
  <!-- Subtle decorative ambient circles -->
  <circle cx="180" cy="140" r="280" fill="#ffffff" opacity="0.05"/>
  <circle cx="1150" cy="620" r="260" fill="#ffffff" opacity="0.05"/>
  <circle cx="800" cy="100" r="180" fill="#38bdf8" opacity="0.08"/>

  <!-- Left Side: Title & Badges -->
  <!-- Practice Badge -->
  <g transform="translate(100, 160)">
    <rect width="180" height="38" rx="19" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="90" y="24" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1.5">PRACTICE PROJECT</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">ModernStore</text>
  <text x="100" y="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="600" fill="#c7d2fe">Angular 21 E-Commerce Platform</text>
  
  <!-- Feature Pills -->
  <g transform="translate(100, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="75" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">NgRx Signals</text>
    
    <!-- Pill 2 -->
    <rect x="162" y="0" width="170" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="247" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Angular Material 3</text>
    
    <!-- Pill 3 -->
    <rect x="344" y="0" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="424" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Tailwind CSS 4</text>

    <!-- Pill 4 -->
    <rect x="0" y="48" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="65" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">SSR Engine</text>

    <!-- Pill 5 -->
    <rect x="142" y="48" width="160" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="222" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Cart &amp; Wishlist</text>
  </g>

  <!-- Right Side UI Card Mockup -->
  <g transform="translate(710, 130)" filter="url(#msShadow)">
    <!-- Main App Container Mockup -->
    <rect width="470" height="460" rx="20" fill="url(#msCard)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    
    <!-- Mock Header bar -->
    <rect x="20" y="20" width="430" height="48" rx="12" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="45" cy="44" r="10" fill="#38bdf8"/>
    <rect x="65" y="38" width="80" height="12" rx="6" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="320" y="34" width="60" height="20" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <circle cx="410" cy="44" r="12" fill="#f43f5e" fill-opacity="0.8"/>

    <!-- Category Pills Mockup -->
    <g transform="translate(20, 84)">
      <rect x="0" y="0" width="70" height="26" rx="13" fill="#ffffff" fill-opacity="0.9"/>
      <text x="35" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#4f46e5">All</text>
      
      <rect x="78" y="0" width="95" height="26" rx="13" fill="#ffffff" fill-opacity="0.15"/>
      <text x="125" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ffffff">Electronics</text>
      
      <rect x="181" y="0" width="75" height="26" rx="13" fill="#ffffff" fill-opacity="0.15"/>
      <text x="218" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ffffff">Audio</text>

      <rect x="264" y="0" width="85" height="26" rx="13" fill="#ffffff" fill-opacity="0.15"/>
      <text x="306" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#ffffff">Fashion</text>
    </g>

    <!-- Product Card 1 -->
    <g transform="translate(20, 126)">
      <rect width="205" height="294" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.15"/>
      <!-- Product Image Area -->
      <rect x="12" y="12" width="181" height="150" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <circle cx="102" cy="80" r="32" fill="#818cf8" fill-opacity="0.4"/>
      <!-- Heart Icon -->
      <circle cx="170" cy="30" r="12" fill="#ffffff" fill-opacity="0.25"/>
      <!-- Product Title & Rating -->
      <rect x="14" y="174" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.8"/>
      <rect x="14" y="196" width="70" height="10" rx="5" fill="#fbbf24"/>
      <!-- Price & Add button -->
      <rect x="14" y="222" width="65" height="18" rx="6" fill="#38bdf8" fill-opacity="0.9"/>
      <rect x="14" y="252" width="177" height="30" rx="8" fill="#4f46e5"/>
      <text x="102" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">+ Add to Cart</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(245, 126)">
      <rect width="205" height="294" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.15"/>
      <!-- Product Image Area -->
      <rect x="12" y="12" width="181" height="150" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="62" y="55" width="80" height="55" rx="8" fill="#a78bfa" fill-opacity="0.4"/>
      <!-- Heart Icon -->
      <circle cx="170" cy="30" r="12" fill="#ffffff" fill-opacity="0.25"/>
      <!-- Product Title & Rating -->
      <rect x="14" y="174" width="105" height="14" rx="7" fill="#ffffff" fill-opacity="0.8"/>
      <rect x="14" y="196" width="70" height="10" rx="5" fill="#fbbf24"/>
      <!-- Price & Add button -->
      <rect x="14" y="222" width="65" height="18" rx="6" fill="#38bdf8" fill-opacity="0.9"/>
      <rect x="14" y="252" width="177" height="30" rx="8" fill="#4f46e5"/>
      <text x="102" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">+ Add to Cart</text>
    </g>
  </g>
</svg>
